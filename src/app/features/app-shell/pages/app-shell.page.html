<div class="flex h-screen overflow-hidden bg-[var(--color-bg-primary)]">
  <aside
    class="shell-sidebar hidden shrink-0 flex-col overflow-hidden border-r border-[var(--color-border-default)] bg-[var(--color-bg-secondary)] md:flex"
    [class.shell-sidebar--expanded]="layoutStore.isSidebarExpanded()"
    [class.shell-sidebar--collapsed]="!layoutStore.isSidebarExpanded()"
    role="navigation"
    aria-label="Sidebar"
  >
    @if (layoutStore.isSidebarExpanded()) {
      <app-sidebar-panel />
    } @else {
      <app-sidebar-rail />
    }
  </aside>
  <main class="relative flex min-h-0 w-full min-w-0 flex-1 flex-col overflow-y-auto p-6">
    <router-outlet />
    <button
      type="button"
      (click)="layoutStore.openDrawer()"
      class="fixed bottom-6 left-6 z-30 rounded-full border border-[var(--color-border-default)] bg-[var(--color-bg-secondary)] p-3 shadow-lg md:hidden"
      aria-label="Open menu"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" x2="20" y1="12" y2="12" />
        <line x1="4" x2="20" y1="6" y2="6" />
        <line x1="4" x2="20" y1="18" y2="18" />
      </svg>
    </button>
  </main>
</div>
<app-sidebar-drawer />
